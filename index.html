<html>

<head>
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<nav>

    <h1>Job Tracker</h1>

    <p>Track your applications smartly</p>

</nav>
    <div class="dashboard">

    <div class="stat-card">
        <h3>Total Applications</h3>
        <p id="totalCount">0</p>
    </div>


    <div class="stat-card">
        <h3>Applied</h3>
        <p id="appliedCount">0</p>
    </div>


    <div class="stat-card">
        <h3>Interview</h3>
        <p id="interviewCount">0</p>
    </div>


    <div class="stat-card">
        <h3>Rejected</h3>
        <p id="rejectedCount">0</p>
    </div>

</div>

    <div class="form-container">

        <input type="text" id="jobTitle" placeholder="Job Title">

        <input type="text" id="companyName" placeholder="Company Name">


        <select id="jobStatus">
            <option>Applied</option>
            <option>Interview</option>
            <option>Rejected</option>
            <option>Offer Received</option>
            <option>Selected</option>
        </select>


        <button id="addBtn">Add Application</button>
        <button id="updateBtn" style="display:none;">Update Application</button>

    </div>


    <h2>Applications</h2>


    <input type="text" id="searchInput" placeholder="Search jobs...">


    <select id="filterStatus">

        <option value="All">All</option>
        <option value="Applied">Applied</option>
        <option value="Interview">Interview</option>
        <option value="Rejected">Rejected</option>
        <option value="Offer Received">Offer Received</option>
        <option value="Selected">Selected</option>

    </select>


    <div id="applications">

    </div>


</div>


<script src="script.js"></script>

</body>

</html>
